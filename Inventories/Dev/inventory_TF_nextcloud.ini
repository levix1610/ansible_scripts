# ----------------------------------------------------------------------------
# Inventory for deploying Nextcloud Server
# ----------------------------------------------------------------------------

[all:vars]
# Variables common to ALL hosts in this file
ansible_ssh_common_args='-o StrictHostKeyChecking=no' # Allows connection without pre-adding keys
ansible_user=levix

# --- Required Variables ---
clone_dir="~/terraform_scripts"
tf_working_subdir="environment/dev/nextcloud"
tf_working_dir="{{ clone_dir }}/{{ tf_working_subdir }}"
tfvars_file="dev-nextcloud.tfvars"
env_script_path="~/terraform_api_prod.sh" # Test Servers running in unified stack

[ssh_server]
10.0.150.40
