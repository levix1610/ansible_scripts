---
- name: Provision Docker and Portainer Host
  hosts: remote_docker  # Ensure this matches your inventory
  become: true
  vars:
    user_name: "levix"  # Your user for the docker group

  tasks:
    - name: Install prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Create directory for Docker keyring
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG apt Key (via curl)
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc

    - name: Add Docker Repository
      apt_repository:
        repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine and Plugins
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is started and enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user:
        name: "{{ user_name }}"
        groups: docker
        append: yes
  
    - name: Create Portainer data volume via shell fallback
      ansible.builtin.command: docker volume create portainer_data
      args:
        creates: /var/lib/docker/volumes/portainer_data  # Skip if it already exists

    - name: Deploy Portainer Container via shell fallback
      ansible.builtin.command: >
        docker run -d
        --name portainer 
        --restart always 
        -p 8000:8000 
        -p 9443:9443 
        -v /var/run/docker.sock:/var/run/docker.sock 
        -v portainer_data:/data 
        portainer/portainer-ce:latest
      register: docker_run_result
      failed_when: 
        - docker_run_result.rc != 0 
        - "'Already In Use' not in docker_run_result.stderr"
      changed_when: docker_run_result.rc == 0
      