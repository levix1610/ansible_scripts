# This playbook is for stopping and starting the microk8s service across all control planes.
# Migrating live hosts between different CPU architectures sometimes causes the cluster to lose sync.

---
- name: Gracefully Restart MicroK8s Cluster Nodes
  hosts: k8s_nodes
  serial: 1 # Guarantees sequential, one-by-one node restarts
  become: true

  tasks:
    - name: Drain node prior to restart
      command: microk8s kubectl drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data --timeout=60s
      delegate_to: "{{ groups['k8s_control_plane'][0] }}"
      failed_when: false

    - name: Stop MicroK8s services
      command: microk8s stop

    - name: Pause to allow kernel socket cleanup
      ansible.builtin.pause:
        seconds: 10

    - name: Start MicroK8s services
      command: microk8s start

    - name: Wait for MicroK8s node status to become Ready
      command: microk8s status --wait-ready
      register: status_result
      until: "'microk8s is running' in status_result.stdout"
      retries: 15
      delay: 10

    - name: Uncordon node
      command: microk8s kubectl uncordon {{ inventory_hostname }}
      delegate_to: "{{ groups['k8s_control_plane'][0] }}"