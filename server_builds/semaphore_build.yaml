---
- name: Install Semaphore UI on Ubuntu
  hosts: semaphore
  become: yes
  vars:
    semaphore_version: "2.19.12"
    semaphore_arch: "amd64"
    semaphore_deb_name: "semaphore_{{ semaphore_version }}_linux_{{ semaphore_arch }}.deb"
    semaphore_deb_url: "https://github.com/semaphoreui/semaphore/releases/download/v{{ semaphore_version }}/{{ semaphore_deb_name }}"
    download_dest: "/tmp/{{ semaphore_deb_name }}"
    semaphore_config_dir: "/etc/semaphore"

  tasks:
    - name: Ensure Git and Ansible are installed (required for Semaphore runners)
      apt:
        name:
          - git
          - ansible
          - wget
        state: present
        update_cache: yes

    - name: Download Semaphore native package using wget
      command: wget -q -O {{ download_dest }} {{ semaphore_deb_url }}
      args:
        creates: "{{ download_dest }}"

    - name: Install Semaphore package
      apt:
        deb: "{{ download_dest }}"

    - name: Create directory for Semaphore configuration and SQLite DB
      file:
        path: "{{ semaphore_config_dir }}"
        state: directory
        mode: '0755'

    - name: Clean up downloaded package
      file:
        path: "{{ download_dest }}"
        state: absent